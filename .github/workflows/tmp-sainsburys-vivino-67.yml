name: One-off Sainsbury's 67 wine Vivino run
on:
  push:
    branches:
      - catalog/sainsburys-wines-2026-11-06
    paths:
      - scripts/tmp-sainsburys-vivino-67.mjs
      - .github/workflows/tmp-sainsburys-vivino-67.yml
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --experimental-strip-types scripts/tmp-sainsburys-vivino-67.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sainsburys-vivino-67-results
          path: sainsburys-vivino-67-results.json
          if-no-files-found: warn
