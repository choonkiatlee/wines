name: One-off Sainsbury's catalogue access probe
on:
  push:
    branches: [catalog/sainsburys-wines-2026-11-06]
    paths:
      - .github/workflows/sainsburys-catalog-probe.yml
      - scripts/sainsburys-catalog-access-probe.mjs
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node scripts/sainsburys-catalog-access-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sainsburys-catalog-probe
          path: sainsburys-category-*
          if-no-files-found: ignore
