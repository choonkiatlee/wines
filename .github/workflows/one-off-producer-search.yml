name: One-off Vivino producer search capabilities
on:
  push:
    branches:
      - one-off/producer-algolia-probe-20261107
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Probe producer identity, filterability, pagination and rating statistics
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'EOF'
          import {VivinoAlgoliaClient} from './packages/vivino-client/src/index.ts';
          let paramsFromClient = null;
          const client = new VivinoAlgoliaClient({fetch: async (url,init) => {
            paramsFromClient = {url: String(url), headers:init.headers};
            return fetch(url,init);
          }});
          const seed = await client.searchWines('G.D. Vajra',20);
          const exact = seed.candidates.filter(w => w.winery?.name === 'G.D. Vajra');
          const id = exact[0]?.winery?.id;
          console.log('PRODUCER_SEED',JSON.stringify({
            total:seed.total, exact:exact.length,
            wineryObject:exact[0]?.winery??null,
            firstWine:exact[0]?{id:exact[0].id,name:exact[0].name, statistics:exact[0].statistics}:null
          }));
          if(!paramsFromClient) throw new Error('Missing search parameters');
          async function probe(label, payload){
            try{
              const res = await fetch(paramsFromClient.url,{method:'POST',headers:paramsFromClient.headers,body:JSON.stringify(payload)});
              const body = await res.json();
              const hits = body.hits ?? [];
              const same = hits.filter(w=>w.winery?.name==='G.D. Vajra');
              const avgInputs = same.filter(w=>w.statistics?.status==='Normal'&&Number.isFinite(w.statistics?.ratings_average)&&w.statistics?.ratings_count>0);
              const totalVotes = avgInputs.reduce((sum,w)=>sum+w.statistics.ratings_count,0);
              const weighted = totalVotes>0 ? avgInputs.reduce((sum,w)=>sum+w.statistics.ratings_average*w.statistics.ratings_count,0)/totalVotes : null;
              console.log('PROBE',JSON.stringify({
                label, status:res.status, message:body.message?.slice?.(0,250)??null,
                total:body.nbHits??null, page:body.page??null, nbPages:body.nbPages??null,
                hitCount:hits.length, exactWineryCount:same.length,
                weightedPartial:weighted, ratingCountPartial:totalVotes,
                wineryIds:[...new Set(hits.map(w=>w.winery?.id))].slice(0,12),
                topRatings:avgInputs.sort((a,b)=>b.statistics.ratings_average-a.statistics.ratings_average).slice(0,5).map(w=>({id:w.id,name:w.name,rating:w.statistics.ratings_average,count:w.statistics.ratings_count})),
                sampleNonExact:hits.filter(w=>w.winery?.name!=='G.D. Vajra').slice(0,3).map(w=>({id:w.id,winery:w.winery?.name,name:w.name})),
                facets:body.facets?Object.keys(body.facets):null,
              }));
            }catch(e){console.log('PROBE_ERROR',label,String(e));}
          }
          await probe('query-100-page-0',{query:'G.D. Vajra',hitsPerPage:100,page:0});
          await probe('query-100-page-1',{query:'G.D. Vajra',hitsPerPage:100,page:1});
          await probe('restrict-attribute',{query:'G.D. Vajra',hitsPerPage:100,restrictSearchableAttributes:['winery.name']});
          await probe('all-facets',{query:'G.D. Vajra',hitsPerPage:0,facets:['*']});
          if(id){
            await probe('numeric-filter-winery-id',{query:'',hitsPerPage:100,numericFilters:['winery.id='+id]});
            await probe('filters-winery-id',{query:'',hitsPerPage:100,filters:'winery.id = '+id});
            await probe('facet-filter-winery-id',{query:'',hitsPerPage:100,facetFilters:['winery.id:'+id]});
          }else console.log('NO_WINERY_ID_IN_RECORD');
          EOF
