name: Wine enrichment Pages

on:
  pull_request:
    paths:
      - 'src/**'
      - 'packages/vivino-client/**'
      - 'apps/pages/**'
      - 'scripts/check-pages-cors.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'packages/vivino-client/**'
      - 'apps/pages/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wine-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Standalone Vivino client typecheck
        run: npm run typecheck -w @choonkiatlee/vivino-client
      - name: Unit tests
        run: npm test
      - name: Build static browser app
        run: npm run pages:build
      - name: Probe browser CORS preflight (diagnostic only)
        continue-on-error: true
        run: node scripts/check-pages-cors.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/pages/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
