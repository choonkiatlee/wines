name: One-off Vivino API integration probe

# Temporarily trigger once when PR #3 is marked ready; no push/master CI.
# Workflow-dispatch is for later explicit reruns, once this file is on master.
on:
  pull_request:
    types: [ready_for_review]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 3
    name: Live VivinoClient method-by-method smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe Vivino API (no retries or bot bypass)
        run: node --experimental-strip-types scripts/live-vivino-smoke.mjs

      - name: Upload response report even if API calls fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivino-live-output
          path: vivino-live-output.json
          if-no-files-found: warn
          retention-days: 7
