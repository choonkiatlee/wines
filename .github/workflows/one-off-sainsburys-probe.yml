name: One-off Sainsburys Vivino live probe
on:
  push:
    branches:
      - probe/sainsburys-vivino-2026-11-06
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enrich selected Sainsbury's wines through VivinoAlgoliaClient
        run: node --experimental-strip-types scripts/one-off-sainsburys-probe.mjs
      - name: Save raw candidate matches and ratings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sainsburys-vivino-live-results
          path: sainsburys-vivino-2026-11-06.json
          if-no-files-found: warn
