name: Sainsbury’s catalogue one-off probe
on:
  push:
    branches: [probe-sainsburys-client-28]
    paths: [.github/workflows/sainsburys-catalogue-probe.yml]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare public category transport and response
        shell: bash
        run: |
          set -eu
          category='https://www.sainsburys.co.uk/groceries/browse/beer-wine-and-spirits/wine/c:1019462'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -V | head -1
          printf 'Proxy variables present:'
          for key in HTTPS_PROXY https_proxy ALL_PROXY all_proxy; do
            if [[ -n "${!key:-}" ]]; then printf ' %s' "$key"; fi
          done
          printf '\nDNS for target (system resolver):\n'
          getent ahostsv4 www.sainsburys.co.uk | awk '!seen[$1]++ {print $1}' || true
          
          probe() {
            local label="$1"
            shift
            printf '\n== %s ==\n' "$label"
            curl -q -sv --max-time 12 --user-agent node --dump-header "$work/headers" --output "$work/body" \
              --write-out 'status=%{http_code} http=%{http_version} type=%{content_type} bytes=%{size_download}\n' \
              "$@" "$category" 2>"$work/trace" || true
            awk '/SSL connection using|ALPN: server accepted|issuer:|subject:/{print}' "$work/trace"
            if [[ -f "$work/headers" ]]; then
              awk 'tolower($0) ~ /^(http\/|server:|via:|x-vercel-id:|x-vercel-error:|x-cache:|x-matched-path:|akamai-grn:|x-akamai-request-id:|location:)/ {print}' "$work/headers"
            fi
            if [[ -f "$work/body" ]]; then
              python - "$work/body" <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          import sys
          sample = unescape(Path(sys.argv[1]).read_bytes()[:1500].decode(errors='replace'))
          if 'Access Denied' in sample:
              print('edge=Access Denied', 'reference=' + str(re.search(r'Reference\s*#([\w.]+)', sample).group(1)) if re.search(r'Reference\s*#([\w.]+)', sample) else '')
              print('error_host=errors.edgesuite.net' if 'errors.edgesuite.net' in sample else 'error_host=unknown')
          PY
            fi
            rm -f "$work/headers" "$work/body" "$work/trace"
          }
          
          probe 'RSC, HTTP/1.1' --http1.1 -H 'RSC: 1'
          probe 'RSC, HTTP/2' --http2 -H 'RSC: 1'
          probe 'Plain page, HTTP/1.1' --http1.1
          probe 'RSC, HTTP/1.1, alternate User-Agent' --http1.1 -H 'RSC: 1' --user-agent 'catalogue-diagnostic/1.0'
          probe 'RSC, HTTP/1.1, TLS 1.2 only' --http1.1 -H 'RSC: 1' --tlsv1.2 --tls-max 1.2
