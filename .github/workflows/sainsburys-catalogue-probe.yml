name: Sainsbury’s catalogue one-off probe
on:
  push:
    branches: [probe-sainsburys-client-28]
    paths: [.github/workflows/sainsburys-catalogue-probe.yml]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/check-sainsburys-catalogue.mjs
