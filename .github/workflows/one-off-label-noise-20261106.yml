name: One-off label-noise matching validation
on:
  push:
    branches:
      - feat/label-noise-robust-matching
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install and run offline suite
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Live Wanderer fetch and enrichment
        run: |
          node --experimental-strip-types --input-type=module <<'EOF'
          import {enrichWines} from './src/index.ts';
          const inputs=[
            {name:'The Wanderer Malbec',type:'red'},
            {name:'The Wanderer After Dark Malbec',type:'red'},
            {name:'The Wanderer Malbec Bold Red Wine Limited Edition After Dark',type:'red'},
          ];
          const results=await enrichWines(inputs,{returnAll:true});
          for(let i=0;i<inputs.length;i++){
            console.log('LIVE_LABEL_RESULT',JSON.stringify({input:inputs[i],error:results[i].error??null,
              matches:results[i].matches.map(p=>({id:p.wine.id,name:p.wine.winery+' '+p.wine.name,
                score:p.ratings.allVintages?.average??null,url:p.sourceUrl}))}));
            if(results[i].matches[0]?.wine.id!==10725356) throw Error('Wrong top match for '+inputs[i].name);
          }
          EOF
      - name: Live 47-wine previous-menu regression
        run: node --experimental-strip-types scripts/one-off-cuvee-probe.mjs
