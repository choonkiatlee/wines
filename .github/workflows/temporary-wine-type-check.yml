name: One-off wine type + ranking validation
on:
  push:
    branches: [feat/cuvee-aware-ranking]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Inspect indexed wine type fields
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import {VivinoAlgoliaClient} from './src/index.ts';
          const client = new VivinoAlgoliaClient();
          for(const name of ['Fanny Sabre Anatole','Dom Pérignon Brut','Opus One','Klabjan White Label','G.D. Vajra Barbera d Alba', 'Château d’Yquem', 'Taylor Tawny Port']){
            const {candidates}=await client.searchWines(name,15);
            console.log('TYPE_PROBE',JSON.stringify({
              input:name,
              hits:candidates.slice(0,10).map(w=>({
                id:w.id,name:w.name,type_id:w.type_id, wine_type_id:w.wine_type_id,
                wine_type:w.wine_type, type:w.type, style_id:w.style_id,
                keys:Object.keys(w).filter(k=>/type|style|color|colour/i.test(k))
              }))
            }));
          }
          NODE
      - name: Run 47-wine menu check
        run: node --experimental-strip-types scripts/one-off-cuvee-probe.mjs
