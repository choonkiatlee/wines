name: One-off Vivino TLS matrix
on:
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
jobs:
  integration:
    if: github.head_ref == 'experiment/vivino-actions-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript
        run: npm install --ignore-scripts --no-save --package-lock=false undici@7.30.1
      - name: Typecheck and offline tests
        run: npm run typecheck && npm test
      - name: Collect 12 HTTP and TLS diagnostic cases
        run: node scripts/vivino-tls-matrix.mjs
      - name: Save per-function outputs and request diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivino-tls-matrix
          path: integration-output/
          retention-days: 14
