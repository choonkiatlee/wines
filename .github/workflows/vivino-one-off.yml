name: One-off Vivino integration check
on:
  pull_request:
    types: [opened, ready_for_review]
permissions:
  contents: read
jobs:
  integration:
    if: github.head_ref == 'experiment/vivino-actions-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install TypeScript
        run: npm install --ignore-scripts --package-lock=false
      - name: Typecheck and offline tests
        run: npm run typecheck && npm test
      - name: Check every client method against live Vivino
        run: node scripts/vivino-http-diagnostic.mjs
      - name: Save per-function outputs and request diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivino-live-check
          path: integration-output/
          retention-days: 7
